spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dbsys?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
# 配置项目启动的端口号
server:
  port: 9999
  servlet:
    context-path: /study/mine

logging:
  level:
    org.springframework.boot: info
    org.springframework.web: info
    com.zaxxer.hikari: info

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springfox:
  documentation:
    swagger-ui:
      enabled: true
